# ============================================================
# docker-compose for oGMemory dev deployment
# ============================================================
#
# Brings up the ogmem + openGauss stack with one command. OpenClaw is opt-in.
# Reads env vars from `deploy/.env` (created from `deploy/.env.example`).
# The ogmem service config lives in `deploy/ogmemory.yaml` (copy from
# `deploy/ogmemory.example.yaml`).
#
# By default, ogmem and openclaw are built from local source via the
# Dockerfiles in `../docker/`. To use a prebuilt image instead, set
# `OGMEM_IMAGE=...` or `OPENCLAW_IMAGE=...` in `.env` (compose will pull
# that image and skip the build).
#
# Usage:
#   cd deploy
#   cp .env.example .env           # one-time
#   cp ogmemory.example.yaml ogmemory.yaml
#   edit .env                      # set VECTOR_DB_PASSWORD, STORAGE_DB_PASSWORD, LLM_*, etc.
#   edit ogmemory.yaml             # set model names, etc. (DB DSNs come from env)
#   docker compose --profile with-db build              # build ogmem from source
#   docker compose --profile with-db up -d              # openGauss + postgres + ogmem
#   docker compose --profile with-db --profile with-openclaw up -d   # + openclaw gateway
#   docker compose --profile with-db --profile with-cv up -d --build  # + CPU face detection
#   docker compose -f docker-compose.cv.yml up -d --build --wait      # CV only, no DB/LLM credentials
#   docker compose --profile with-db down               # stop (keeps volumes)
#   docker compose --profile with-db down -v            # stop and drop volumes
#
#   # M3-Bench SQL Graph Store integration tests — Postgres only, no ogmem.
#   # `with-m3` lists the same `postgres` service as `with-db`, so:
#   #   docker compose --profile with-m3 up -d
#   # brings JUST Postgres with pgvector (no ogmem, no openclaw, no openGauss).
#   # This is the "single-DB" convenience path: instead of running an
#   # openGauss cluster for the vector index, M3 points at the same
#   # Postgres container the graph store uses. The M3 OpenGaussVectorIndex
#   # code path runs unmodified against PG+pgvector because the SQL
#   # (CREATE EXTENSION vector, vector(N), hnsw, MERGE INTO) is portable.
#   # The test then connects via `OGMEM_TEST_DSN` and the schema lazy-loads
#   # on first connect (`SQLGraphStore._ensure_schema`).
#   # See tests/integration/test_sql_graph_search_by_embedding.py and
#   # tests/integration/m3/test_vector_index_path.py for the env vars.
#
# Env-var naming: the deploy surface has exactly two DB connection
# families — STORAGE_DB_* (the SQL storage Postgres) and VECTOR_DB_*
# (the vector DB: openGauss in production, or the same pgvector Postgres
# in single-DB deployments). The old POSTGRES_* / OPENGAUSS_* / OG_*
# .env spellings are gone; only the in-container vars dictated by the
# official images (POSTGRES_PASSWORD etc. for postgres, GS_* for
# openGauss) keep their upstream names.
#
# Profiles:
#   with-db   opt-in  openGauss + ogmem (Postgres is implicitly included).
#                    Skip if you run an external DB and set VECTOR_DB_HOST /
#                    STORAGE_DB_HOST manually. openGauss remains the
#                    recommended production target for the vector index;
#                    the Postgres container is shipped with pgvector so
#                    the same pipeline runs against it for dev / single-DB
#                    deployments without any openGauss dependency.
#   with-openclaw  opt-in  OpenClaw gateway (web UI on $GATEWAY_PORT)
#   with-m3    opt-in  Postgres only — `graph_schema.sql` is loaded lazily
#                    by the first SQLGraphStore connection. Use when running
#                    the M3-Bench SQL integration tests in isolation; the
#                    same Postgres container is shared with `with-db` if both
#                    profiles are enabled.
#
# Notes:
#   * Both `ogmem` and `openclaw` use `network_mode: host`, so they bind
#     directly to the host's loopback (127.0.0.1). `OGMEM_URL` therefore
#     defaults to `http://127.0.0.1:${OGMEM_HTTP_PORT}` — the bridge-network
#     `ogmem` DNS name does NOT resolve from inside a host-networked
#     container.
#   * Data is held in named volumes (ogmem_ogdb, ogmem_postgres-data,
#     ogmem_openclaw-home). Use `docker compose down -v` to drop them.
#   * Required vars (no default, must be set in .env): VECTOR_DB_PASSWORD,
#     STORAGE_DB_PASSWORD, LLM_PROVIDER, LLM_API_KEY, LLM_BASE_URL, LLM_MODEL.
#     (Not required for `with-m3` alone — only `STORAGE_DB_PASSWORD` and the
#     ogmem LLM creds if you also enable `with-db`.)
# ============================================================

name: ogmem

services:

  # Optional CV sidecar. Separate entry point avoids interpolation of
  # unrelated required DB/LLM variables for CV-only benchmark users.
  cv:
    extends:
      file: docker-compose.cv.yml
      service: cv
    profiles: ["with-cv"]
    # Reuse the stack bridge rather than implicitly allocating another
    # default network (which can fail on hosts with exhausted address pools).
    networks:
      - ant-trail-net

  # --------------------------------------------------------------
  # openGauss — vector DB only (when storage.backend=sql, context store
  # lives in the postgres service below).
  # Always pulled from registry; we don't build openGauss from source.
  #
  # The GS_* container vars are dictated by the openGauss image entrypoint;
  # the .env source vars feeding them are VECTOR_DB_* so the deploy surface
  # stays two-named: STORAGE_DB_* (storage DB) and VECTOR_DB_* (vector DB).
  # --------------------------------------------------------------
  opengauss:
    # Accept the full ref (OG_IMAGE) or the split form (OG_IMAGE_REPO + OG_IMAGE_TAG)
    # used by the legacy deploy.env. Falls back to the in-compose default.
    image: ${OG_IMAGE:-${OG_IMAGE_REPO:-swr.cn-north-4.myhuaweicloud.com/kunpeng-ai/opengauss-distributed}:${OG_IMAGE_TAG:-0328}}
    container_name: ${VECTOR_DB_CONTAINER_NAME:-opengauss}
    profiles: ["with-db"]
    privileged: true
    restart: unless-stopped
    environment:
      GS_PASSWORD: ${VECTOR_DB_PASSWORD:?VECTOR_DB_PASSWORD is required — set it in deploy/.env}
      GS_USER_PASSWORD: ${VECTOR_DB_PASSWORD}
      GS_NODENAME: ${VECTOR_DB_NODE_NAME:-gaussdb}
      GS_USERNAME: ${VECTOR_DB_USER:-gaussdb}
      GS_PORT: ${VECTOR_DB_PORT:-5432}
      GS_DB: ${VECTOR_DB_NAME:-postgres}
    ports:
      - "${VECTOR_DB_HOST_PORT:-5432}:${VECTOR_DB_PORT:-5432}"
    volumes:
      - ogdb:/var/lib/opengauss
    healthcheck:
      test:
        - CMD-SHELL
        - su - omm -c "gsql -d ${VECTOR_DB_NAME:-postgres} -p ${VECTOR_DB_PORT:-5432} -c 'SELECT 1;'" >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - ant-trail-net

  # --------------------------------------------------------------
  # postgres — SQL storage backend (context files, grants, outbox,
  # subscriptions, etc.). The image is `pgvector/pgvector:pg16` (NOT
  # plain `postgres:16`) so the same container can ALSO act as the M3
  # vector index backend via the pgvector extension — eliminating
  # the need to run a separate openGauss cluster for dev / single-DB
  # deployments.
  #
  # Production should still target an openGauss cluster for the
  # vector index (see the `opengauss` service above); this container
  # is the "single-DB convenience" alternative. Switch by pointing
  # ``vector_db.connection_string`` in `deploy/ogmemory.yaml`
  # at whichever instance you want — the M3 vector index inherits
  # that same DSN (no separate key), and the underlying
  # `OpenGaussVectorIndex` code path runs unmodified against both
  # (the `_ensure_table` migration issues `CREATE EXTENSION IF NOT
  # EXISTS vector`, which is a no-op on this image and a graceful
  # ignored syntax error on openGauss, which ships `vector(N)`
  # natively).
  #
  # Started under `with-db` for the ogmem stack; started under
  # `with-m3` for the M3-Bench SQL Graph Store integration tests,
  # where it is the only service brought up. Skip if you have an
  # external Postgres and set STORAGE_DB_HOST.
  #
  # The POSTGRES_PASSWORD / POSTGRES_USER / POSTGRES_DB container vars
  # are dictated by the official postgres image entrypoint and cannot
  # be renamed — but the .env source vars feeding them are
  # STORAGE_DB_PASSWORD / STORAGE_DB_USER / STORAGE_DB_NAME so the
  # deploy surface stays two-named: STORAGE_DB_* (storage DB) and
  # VECTOR_DB_* (vector DB).
  #
  # `graph_schema.sql` is loaded lazily the first time SQLGraphStore
  # connects (see SQLGraphStore._ensure_schema), so the integration
  # tests do not need a separate init job.
  # --------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ${STORAGE_DB_CONTAINER_NAME:-ogmem-postgres}
    profiles: ["with-db", "with-m3"]
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${STORAGE_DB_PASSWORD:?STORAGE_DB_PASSWORD is required — set it in deploy/.env}
      POSTGRES_USER: ${STORAGE_DB_USER:-ogmem}
      POSTGRES_DB: ${STORAGE_DB_NAME:-ogmem}
    ports:
      - "${STORAGE_DB_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${STORAGE_DB_USER:-ogmem} -d ${STORAGE_DB_NAME:-ogmem}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - ant-trail-net
  # --------------------------------------------------------------
  # ogmem — the memory HTTP API
  # Built from local source by default (`docker/Dockerfile.standalone`).
  # Override with `OGMEM_IMAGE=...` in .env to pull a prebuilt image instead.
  # --------------------------------------------------------------
  ogmem:
    build:
      context: ..
      dockerfile: docker/Dockerfile.standalone
    image: ${OGMEM_IMAGE:-ogmemory:local}
    container_name: ${OGMEM_CONTAINER_NAME:-ogmem}
    profiles: ["with-db"]
    restart: unless-stopped
    # Use the host's network namespace so the container can reach services
    # running on the host (e.g. the embedding server on host port 8345) via
    # 127.0.0.1. Same pattern as the openclaw service. The ogmem listens on
    # ${OGMEM_HTTP_PORT} on the host directly; the `ports:` mapping below is
    # therefore omitted (compose ignores it under network_mode: host).
    network_mode: host
    depends_on:
      opengauss:
        condition: service_healthy
        required: false
      postgres:
        condition: service_healthy
        required: false
    environment:
      OGMEM_MCP_PORT: ${OGMEM_MCP_PORT:-8091}
      # ---- Vector DB connection (consumed by entrypoint for vector_db).
      # Named VECTOR_DB_* because the backend may be openGauss OR
      # PostgreSQL+pgvector — same DSN shape either way. ----
      # Host defaults to 127.0.0.1 because the ogmem container runs with
      # network_mode: host, so the only address that reaches the bridge-
      # networked opengauss / postgres siblings is the host loopback (the
      # compose service names opengauss / postgres do NOT resolve from
      # the host network namespace). Override to the DB's real IP for
      # external / managed databases.
      VECTOR_DB_HOST: ${VECTOR_DB_HOST:-127.0.0.1}
      # *_HOST_PORT is the host port — the port the ogmem process dials
      # via loopback to reach the bridge-networked DB (compose forwards
      # this to the container-internal port, which for openGauss is
      # VECTOR_DB_PORT and for postgres is hardcoded 5432). The name
      # matches what ogmemory.yaml and the entrypoint read directly —
      # we do NOT alias it through VECTOR_DB_PORT because that name
      # means something different at the compose layer (openGauss
      # container-internal port / GS_PORT).
      VECTOR_DB_HOST_PORT: ${VECTOR_DB_HOST_PORT:-5432}
      VECTOR_DB_NAME: ${VECTOR_DB_NAME:-postgres}
      VECTOR_DB_USER: ${VECTOR_DB_USER:-gaussdb}
      VECTOR_DB_PASSWORD: ${VECTOR_DB_PASSWORD:?VECTOR_DB_PASSWORD is required — set it in deploy/.env}
      # ---- Storage DB connection (consumed by entrypoint for
      # storage.connection_string). Mirrors the VECTOR_DB_* layout above
      # so the deploy surface stays two-named: STORAGE_DB_* (storage DB)
      # and VECTOR_DB_* (vector DB). ----
      STORAGE_DB_HOST: ${STORAGE_DB_HOST:-127.0.0.1}
      STORAGE_DB_HOST_PORT: ${STORAGE_DB_HOST_PORT:-5432}
      STORAGE_DB_NAME: ${STORAGE_DB_NAME:-ogmem}
      STORAGE_DB_USER: ${STORAGE_DB_USER:-ogmem}
      STORAGE_DB_PASSWORD: ${STORAGE_DB_PASSWORD:?STORAGE_DB_PASSWORD is required — set it in deploy/.env}
      # ---- Storage backend ----
      OGMEM_FS_BACKEND: ${OGMEM_FS_BACKEND:-sql}
      # ---- LLM ----
      LLM_PROVIDER: ${LLM_PROVIDER:?LLM_PROVIDER is required — set it in deploy/.env}
      LLM_API_KEY: ${LLM_API_KEY:?LLM_API_KEY is required — set it in deploy/.env}
      LLM_BASE_URL: ${LLM_BASE_URL:?LLM_BASE_URL is required — set it in deploy/.env}
      LLM_MODEL: ${LLM_MODEL:?LLM_MODEL is required — set it in deploy/.env}
      # ---- HTTP ----
      OGMEM_HTTP_PORT: ${OGMEM_HTTP_PORT:-8090}
      OGMEM_WORKERS: ${OGMEM_WORKERS:-2}
      OGMEM_GUNICORN_TIMEOUT: ${OGMEM_GUNICORN_TIMEOUT:-900}
      # ---- Identity / auth ----
      OG_ACCOUNT_ID: ${OG_ACCOUNT_ID:-acct-demo}
      OG_USER_ID: ${OG_USER_ID:-u-alice}
      OG_AGENT_ID: ${OG_AGENT_ID:-main}
      OG_ROLE_CONTROL_ENABLED: ${OG_ROLE_CONTROL_ENABLED:-false}
      OG_ROOT_API_KEY: ${OG_ROOT_API_KEY:-}
      OG_ADMIN_API_KEYS: ${OG_ADMIN_API_KEYS:-}
      OG_AGENT_SHARED_MODE: ${OG_AGENT_SHARED_MODE:-off}
      OG_AGENT_SHARED_LIST: ${OG_AGENT_SHARED_LIST:-}
      OG_HTTP_IP_ALLOWLIST: ${OG_HTTP_IP_ALLOWLIST:-}
      OG_HTTP_IP_ALLOWLIST_TRUST_PROXY: ${OG_HTTP_IP_ALLOWLIST_TRUST_PROXY:-false}
      OG_HTTP_TRUSTED_PROXIES: ${OG_HTTP_TRUSTED_PROXIES:-}
      # ---- Index ----
      INDEX_INTERVAL: ${INDEX_INTERVAL:-15}
      INDEX_WORKERS: ${INDEX_WORKERS:-1}
      # ---- Perf ----
      OGMEM_PERF_ENABLED: ${OGMEM_PERF_ENABLED:-}
      OGMEM_PERF_OUT: ${OGMEM_PERF_OUT:-}
      OGMEM_PERF_HTTP_URL: ${OGMEM_PERF_HTTP_URL:-}
      OGMEM_PERF_RUN_ID: ${OGMEM_PERF_RUN_ID:-}
      # ---- Proxy ----
      no_proxy: "*"
      NO_PROXY: "*"
    # No `ports:` — with network_mode: host, the container binds directly
    # to the host's port ${OGMEM_HTTP_PORT} (default 8090, see .env).
    volumes:
      - ./ogmemory.yaml:/etc/ogmem/config.yaml:ro
      # Perf logs: drop a host dir into PERF_LOGS_HOST_DIR or accept the default
      # (./_artifacts/perf inside the deploy/ directory).
      - ${PERF_LOGS_HOST_DIR:-./_artifacts/perf}:/opt/ogmem/perf_logs
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${OGMEM_HTTP_PORT:-8090}/api/v1/health', timeout=2).read()"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # --------------------------------------------------------------
  # openclaw — web gateway (opt-in)
  # Built from local source by default (`docker/Dockerfile.openclaw`).
  # Override with `OPENCLAW_IMAGE=...` in .env to pull a prebuilt image instead.
  #
  # Uses `network_mode: host` because the openclaw image (2026.3.24) binds
  # its gateway to 127.0.0.1, which is unreachable via Docker's bridge port
  # mapping. With host networking, the in-container 127.0.0.1 IS the host's
  # 127.0.0.1 and the gateway becomes reachable. The `ports:` mapping is
  # therefore omitted — set GATEWAY_PORT to the port you want to expose on
  # the host (and on which openclaw listens inside the container).
  # --------------------------------------------------------------
  openclaw:
    build:
      context: ..
      dockerfile: docker/Dockerfile.openclaw
    image: ${OPENCLAW_IMAGE:-openclaw-ogmemory:local}
    container_name: ${OPENCLAW_CONTAINER_NAME:-openclaw_ogmem}
    profiles: ["with-openclaw"]
    network_mode: host
    restart: unless-stopped
    depends_on:
      ogmem:
        condition: service_healthy
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_MODEL: ${LLM_MODEL}
      # With network_mode: host, the in-container port and the host port are
      # the same. Pass GATEWAY_PORT through so the gateway listens on the
      # host port the user chose.
      GATEWAY_PORT: ${GATEWAY_PORT:-18789}
      # Disable the openclaw Bonjour / mDNS advertiser. With
      # network_mode: host the container sees every interface on the host
      # (eth0, wlan0, docker0, ...); the ciao probe packet that the
      # responder fires at startup then includes an A/AAAA record per
      # interface and blows past the 1440-byte UDP MTU
      # (`AssertionError: Probe query packet exceeds the mtu size
      # (2115>1440)`), which crashes the gateway. mDNS over a host-network
      # container also serves no real purpose — the broadcast stays on the
      # host loopback and isn't discoverable from other devices anyway.
      # Override with OPENCLAW_DISABLE_BONJOUR=0 only if the user is
      # explicitly opting into LAN discovery.
      OPENCLAW_DISABLE_BONJOUR: ${OPENCLAW_DISABLE_BONJOUR:-1}
      # Both services run on the host network namespace, so 127.0.0.1 inside
      # this container IS the host's 127.0.0.1. The `ogmem` DNS name from
      # compose bridge networking does NOT resolve here. If you bring ogmem
      # up on a different host (or switch it to bridge networking), override
      # this via OGMEM_URL in .env.
      OGMEM_URL: ${OGMEM_URL:-http://127.0.0.1:${OGMEM_HTTP_PORT:-8090}}
      # The plugin reads OGMEM_API_URL (not OGMEM_URL). Mirror it here so the
      # plugin picks up the same .env value rather than falling back to a
      # hardcoded default. (Dockerfile.openclaw intentionally does not set
      # OGMEM_API_URL, so this compose env wins.)
      OGMEM_API_URL: ${OGMEM_URL:-http://127.0.0.1:${OGMEM_HTTP_PORT:-8090}}
      OG_AUTH_API_KEY: ${OG_AUTH_API_KEY:-${OG_ROOT_API_KEY:-}}
      OG_AUTH_ACCOUNT_ID: ${OG_AUTH_ACCOUNT_ID:-${OG_ACCOUNT_ID:-}}
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-ogmem-default-token}
      OPENCLAW_BIND_MODE: ${OPENCLAW_BIND_MODE:-lan}
      no_proxy: "*"
      NO_PROXY: "*"
    # No `ports:` — with network_mode: host, the container listens directly
    # on GATEWAY_PORT of the host. See the comment block above.
    volumes:
      # Persist OpenClaw state (auth pairing, agents, sessions) across
      # container restarts. If OPENCLAW_HOME_DIR is set, bind-mount it so
      # the user has direct host-side access; otherwise use the named volume
      # declared at the bottom of this file.
      - ${OPENCLAW_HOME_DIR:-openclaw-home}:/home/node/.openclaw
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -fsS http://127.0.0.1:${GATEWAY_PORT:-18789}/ >/dev/null 2>&1 || exit 1"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

volumes:
  ogdb:
  postgres-data:
  openclaw-home:

networks:
  ant-trail-net:
    driver: bridge
    ipam:
      config:
        - subnet: ${NETWORK_SUBNET:-172.80.0.0/16}
