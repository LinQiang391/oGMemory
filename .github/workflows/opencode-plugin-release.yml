name: OpenCode Plugin Release

on:
  pull_request:
  push:
    branches: [dev]
    tags: ["opencode-plugin-v*"]

permissions:
  contents: read

concurrency:
  group: opencode-plugin-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate on Node.js ${{ matrix.node }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [18, 24]
    defaults:
      run:
        working-directory: opencode-plugin
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}

      - name: Validate package
        run: |
          npm run check
          npm test
          npm pack --dry-run
          node -e "import('./index.mjs').then(m=>{if(typeof m.default!=='function')process.exit(1)})"

  publish:
    name: Publish @opengauss/ogmemory-opencode-plugin
    needs: validate
    if: startsWith(github.ref, 'refs/tags/opencode-plugin-v')
    runs-on: ubuntu-24.04
    environment: npm-production
    permissions:
      contents: read
    defaults:
      run:
        working-directory: opencode-plugin
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Resolve package version
        id: package
        run: |
          node -e "const pkg=require('./package.json');if(pkg.name!=='@opengauss/ogmemory-opencode-plugin')throw new Error('Unexpected package name: '+pkg.name);console.log('name='+pkg.name);console.log('version='+pkg.version)" >> "$GITHUB_OUTPUT"

      - name: Check whether version already exists
        id: published
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: node scripts/check-published.mjs

      - name: Verify release tag
        env:
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          expected="opencode-plugin-v$PACKAGE_VERSION"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "Expected tag $expected for package version $PACKAGE_VERSION" >&2
            exit 1
          fi

      - name: Publish package
        if: steps.published.outputs.exists == 'false'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NPM_TOKEN:-}" ]; then
            echo "NPM_TOKEN is required because the GitCode source repository cannot use npm trusted publishing." >&2
            exit 1
          fi
          npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          npm publish --access public
