# ============================================================
# oG-Memory 配置文件示例
# ============================================================
#
# 将此文件挂载到容器的 /etc/ogmem/config.yaml:
#   docker run -v ./ogmemory.yaml:/etc/ogmem/config.yaml ogmemory:latest
#
# 也可通过 OGMEM_CONFIG 环境变量指定其他路径:
#   docker run -e OGMEM_CONFIG=/data/my.yaml -v ... ogmemory:latest
#
# 优先级: YAML 值 > 环境变量 > 代码默认值
# 未设置的字段会自动回退到对应的环境变量（向后兼容）。
#
# ---- deploy.sh 一键部署 ----
# 如果使用 deploy/ 一键部署，请使用 deploy/ogmemory.example.yaml，
# 该模板支持 ${ENV_VAR} 语法引用 deploy.env 中的变量，避免重复配置。
# ============================================================

# ---- LLM 配置 ----
llm:
  provider: openai                # mock / openai / openai-cached
  api_key: "your-api-key"
  # api_key_command:
  #   command: ["/usr/local/bin/op", "read", "op://team/ogmemory/api-key"]
  base_url: "https://ark.cn-beijing.volces.com/api/v3"   # 会自动追加 /v1（如不以 /v1 /v2 /v3 结尾）
  model: "doubao-seed-2-0-code-preview-260215"
  temperature: 0.1
  max_tokens: 4096
  json_mode: false

# ---- Embedding 配置 ----
embedding:
  # provider: null                  # 缺省回退到 llm.provider
  model: "doubao-embedding-vision-250615"
  base_url: "https://ark.cn-beijing.volces.com/api/v3"   # 缺省回退到 llm.base_url
  api_key: null                                           # 缺省回退到 llm.api_key
  # api_key_command:
  #   command: ["/usr/local/bin/op", "read", "op://team/ogmemory/embedding-api-key"]
  multimodal: true                                        # 使用 /embeddings/multimodal 端点
  # st_model: "BAAI/bge-large-en-v1.5"                   # Sentence Transformer 本地模型

# ---- 向量数据库 ----
vector_db:
  type: opengauss                    # quickstart: memory; full persistence: opengauss / chroma
  connection_string: "host=127.0.0.1 port=8799 dbname=postgres user=gaussdb password=CHANGE_ME"  # 仅 type=opengauss 时使用
  dimension: 1024
  table_name: vector_index
  pool_size: 5
  # chroma_persist_dir: ".chroma_data"
  # chroma_collection: "contextengine"

# ---- HTTP 服务 ----
service:
  http_port: 8090
  workers: 2
  # http_ip_allowlist: ["127.0.0.1", "10.0.0.0/8"]
  # http_ip_allowlist_trust_proxy: false
  # http_trusted_proxies: ["127.0.0.1"]

# ---- 主存储后端 ----
storage:
  backend: sql                   # agfs / sql
  connection_string: "host=127.0.0.1 port=5432 dbname=ogmemory user=postgres password=postgres"
  pool_size: 5

# ---- AGFS（容器内部使用，一般不需修改）----
agfs:
  base_url: "http://127.0.0.1:1833"
  mount_prefix: "/local/plugin"

# ---- 索引服务 ----
index:
  interval: 15                    # 轮询间隔（秒）
  workers: 1

# ---- 身份/多租户 ----
identity:
  account_id: "acct-demo"
  user_id: "u-alice"
  agent_id: "main"

# ---- 多租认证 ----
auth:
  role_control_enabled: false
  # root_api_key: "root-secret-key-change-me"
  # admin_api_keys:
  #   - "acct-company-a:admin-key-for-a"
  #   - "acct-company-b:admin-key-for-b"

# ---- Agent 共享 ----
sharing:
  agent_shared_mode: "off"        # off / user
  # agent_shared_list:
  #   - "agent-shared-sales"
  #   - "agent-shared-support"

# ---- 记忆提取 ----
memory:
  # after_turn_threshold: 200
  # rolling_compress_enabled: false
  # directory_summary_enabled: false

# ---- 缓存 ----
cache:
  enabled: true
  max_size: 1000
