name: video_episodic_faces
version: 1
description: Vision-only one-video episodic memory pipeline with face detection enabled

artifacts:
  selected_video: "{work_dir}/videos/robot/{video_id}.mp4"
  annotations: "{work_dir}/annotations/one_video.json"
  clips_root: "{work_dir}/clips"
  frames_root: "{work_dir}/frames"
  data_jsonl: "{work_dir}/data.jsonl"
  frames_jsonl: "{work_dir}/frames.jsonl"
  faces_jsonl: "{work_dir}/faces.jsonl"
  episodic_jsonl: "{work_dir}/episodic_memory.jsonl"
  index_jsonl: "{work_dir}/episodic_index.jsonl"
  summary_json: "{work_dir}/pipeline_summary.json"

stages:
  - id: trim
    type: video.trim
    params:
      seconds: "{seconds}"

  - id: annotate
    type: m3.write_single_annotation
    needs: [trim]

  - id: preprocess
    type: m3.preprocess
    needs: [annotate]
    params:
      clip_seconds: 30

  - id: load_clips
    type: m3.load_clips
    needs: [preprocess]
    params:
      clip_seconds: 30

  - id: extract_frames
    type: m3.extract_frames
    needs: [load_clips]
    params:
      fps: 1
      max_frames: 8
      resize: 512
      jpeg_quality: 80
      keyframes_only: false

  - id: detect_faces
    type: m3.detect_faces
    enabled: true
    needs: [extract_frames]
    params:
      backend: http
      min_confidence: 0.5
      max_faces: 20
      cv_timeout: 30

  - id: episodic_memory
    type: m3.episodic_memory
    needs: [extract_frames]
    params:
      max_frames: 8
      no_audio: true

  - id: create_memory_nodes
    type: m3.memory.from_episodic
    needs: [episodic_memory]

  - id: build_index
    type: m3.index_episodic
    enabled: false
    needs: [episodic_memory]
