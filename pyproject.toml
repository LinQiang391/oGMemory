[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ogmemory"
version = "0.1.0"
description = "Semantic memory search using openGauss as vector database"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
keywords = ["vector", "database", "opengauss", "embeddings", "semantic-search"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "openai>=2.24.0",
    "psycopg[binary]>=3.1.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
all = ["ogmemory[openai]"]

[project.urls]
Homepage = "https://github.com/yourusername/oG-Memory"
Documentation = "https://github.com/yourusername/oG-Memory#readme"
Repository = "https://github.com/yourusername/oG-Memory"
Issues = "https://github.com/yourusername/oG-Memory/issues"

[tool.setuptools]
# Map importable package name "ogmemory" to directory "src"
package-dir = {"ogmemory" = "src"}
packages = ["ogmemory", "ogmemory.core", "ogmemory.embeddings", "ogmemory.storage"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
