<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>oGMemory Agent Skill Sedimentation Architecture</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #050d19; color: #e2e8f0; }
    main { width: min(1680px, 100%); margin: 0 auto; padding: 24px; }
    .frame { overflow: auto; border: 1px solid #263d58; border-radius: 20px; background: #071426; box-shadow: 0 24px 80px rgba(0, 0, 0, .38); }
    svg { display: block; width: 100%; min-width: 1100px; height: auto; }
    .note { margin: 16px 4px 0; color: #94a3b8; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <div class="frame">
      <!-- Kept inline so this file remains a standalone, directly viewable artifact. -->
      <svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060" role="img" aria-labelledby="title description">
        <title id="title">oGMemory Agent Skill sedimentation architecture</title>
        <desc id="description">Trace capture is asynchronously assessed and accumulated before deduplication, independent review, publication into oGMemory, and MCP or CLI consumption.</desc>
        <defs>
          <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071426"/><stop offset="1" stop-color="#10233f"/></linearGradient>
          <linearGradient id="published" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#123f3a"/><stop offset="1" stop-color="#13554b"/></linearGradient>
          <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020817" flood-opacity="0.42"/></filter>
          <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#7dd3fc"/></marker>
          <marker id="arrow-muted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
          <style>
            .eyebrow { font: 600 15px ui-sans-serif, system-ui, sans-serif; letter-spacing: 2px; fill: #7dd3fc; }
            .heading { font: 700 36px ui-sans-serif, system-ui, sans-serif; fill: #f8fafc; }
            .subtitle { font: 400 17px ui-sans-serif, system-ui, sans-serif; fill: #aebed2; }
            .lane-label { font: 700 15px ui-sans-serif, system-ui, sans-serif; letter-spacing: 1.4px; fill: #7dd3fc; }
            .box-title { font: 700 19px ui-sans-serif, system-ui, sans-serif; fill: #f8fafc; }
            .box-copy { font: 400 14px ui-sans-serif, system-ui, sans-serif; fill: #cbd5e1; }
            .small { font: 500 13px ui-sans-serif, system-ui, sans-serif; fill: #aebed2; }
            .pill { font: 700 12px ui-sans-serif, system-ui, sans-serif; letter-spacing: .5px; fill: #d9f6ff; }
            .main-arrow { fill: none; stroke: #7dd3fc; stroke-width: 3; marker-end: url(#arrow); }
            .muted-arrow { fill: none; stroke: #94a3b8; stroke-width: 2.5; stroke-dasharray: 8 7; marker-end: url(#arrow-muted); }
          </style>
        </defs>
        <rect width="1600" height="1060" fill="url(#background)"/><circle cx="1450" cy="55" r="270" fill="#0ea5e9" opacity=".06"/><circle cx="100" cy="1010" r="310" fill="#14b8a6" opacity=".05"/>
        <text class="eyebrow" x="90" y="72">OGMEMORY · AGENT SKILLS</text><text class="heading" x="90" y="120">From successful traces to reusable SKILL.md</text><text class="subtitle" x="90" y="155">Asynchronous, evidence-gated, deduplicated, independently reviewed, and explicitly consumed.</text>
        <rect x="70" y="195" width="1460" height="680" rx="28" fill="#0a172a" stroke="#27415f" stroke-width="1.5"/><line x1="70" y1="365" x2="1530" y2="365" stroke="#203650"/><line x1="70" y1="575" x2="1530" y2="575" stroke="#203650"/><line x1="70" y1="755" x2="1530" y2="755" stroke="#203650"/>
        <text class="lane-label" x="95" y="225">CAPTURE</text><text class="lane-label" x="95" y="395">ASSESS &amp; ACCUMULATE</text><text class="lane-label" x="95" y="605">DECIDE &amp; PUBLISH</text><text class="lane-label" x="95" y="785">CONSUME</text>
        <g filter="url(#shadow)"><rect x="200" y="245" width="275" height="92" rx="16" fill="#11253e" stroke="#315779"/><text class="box-title" x="225" y="278">Agent hook events</text><text class="box-copy" x="225" y="305">Tool calls, observations, outcome</text></g><path class="main-arrow" d="M475 291 H555"/>
        <g filter="url(#shadow)"><rect x="560" y="245" width="315" height="92" rx="16" fill="#11253e" stroke="#315779"/><text class="box-title" x="585" y="278">Stop: persist trace turn</text><text class="box-copy" x="585" y="305">Fast storage only · no LLM work</text></g><path class="main-arrow" d="M875 291 H950"/>
        <g filter="url(#shadow)"><rect x="955" y="245" width="365" height="92" rx="16" fill="#11253e" stroke="#315779"/><text class="box-title" x="980" y="278">trace_sessions evidence</text><text class="box-copy" x="980" y="305">Agent-scoped · processing state tracked</text></g>
        <rect x="1240" y="394" width="240" height="58" rx="29" fill="#18324d" stroke="#4a7195"/><text class="pill" x="1270" y="429">SESSIONEND WAKEUP</text><rect x="1240" y="474" width="240" height="58" rx="29" fill="#18283e" stroke="#536579"/><text class="pill" x="1267" y="509">PERIODIC FALLBACK</text><path class="muted-arrow" d="M1240 423 H1140 V472 H1072"/><path class="muted-arrow" d="M1240 503 H1158 V498 H1072"/><path class="main-arrow" d="M1137 337 V405 H483 V444"/>
        <g filter="url(#shadow)"><rect x="200" y="444" width="285" height="96" rx="16" fill="#13243a" stroke="#41617f"/><text class="box-title" x="225" y="477">Deterministic gate</text><text class="box-copy" x="225" y="504">Complete · redacted · tool-realistic</text><text class="small" x="225" y="526">Trace is always untrusted input</text></g><path class="main-arrow" d="M485 492 H555"/>
        <g filter="url(#shadow)"><rect x="560" y="444" width="285" height="96" rx="16" fill="#13243a" stroke="#41617f"/><text class="box-title" x="585" y="477">LLM turn assessment</text><text class="box-copy" x="585" y="504">Success · reusable · specific</text><text class="small" x="585" y="526">Each score ≥ 0.85</text></g><path class="main-arrow" d="M845 492 H915"/>
        <g filter="url(#shadow)"><rect x="920" y="444" width="305" height="96" rx="16" fill="#15304a" stroke="#4a799f"/><text class="box-title" x="945" y="477">Evidence accumulation</text><text class="box-copy" x="945" y="504">Same agent + capability</text><text class="small" x="945" y="526">≥ 5 turns across ≥ 3 sessions</text></g>
        <path class="main-arrow" d="M1072 540 V626 H415"/><g filter="url(#shadow)"><rect x="200" y="626" width="300" height="96" rx="16" fill="#172946" stroke="#526e9d"/><text class="box-title" x="225" y="659">Deduplicate &amp; resolve</text><text class="box-copy" x="225" y="686">Hash → refine → hold → create</text><text class="small" x="225" y="708">Stable URI; consumed evidence is final</text></g><path class="main-arrow" d="M500 674 H575"/>
        <g filter="url(#shadow)"><rect x="580" y="626" width="290" height="96" rx="16" fill="#172946" stroke="#526e9d"/><text class="box-title" x="605" y="659">Compile SKILL.md</text><text class="box-copy" x="605" y="686">Text-only · portable instructions</text><text class="small" x="605" y="708">No scripts or raw trace content</text></g><path class="main-arrow" d="M870 674 H945"/>
        <g filter="url(#shadow)"><rect x="950" y="626" width="285" height="96" rx="16" fill="#172946" stroke="#526e9d"/><text class="box-title" x="975" y="659">Independent review</text><text class="box-copy" x="975" y="686">Safe · accurate · general</text><text class="small" x="975" y="708">Publish score ≥ 0.90</text></g><path class="main-arrow" d="M1235 674 H1300"/>
        <g filter="url(#shadow)"><rect x="1305" y="626" width="175" height="96" rx="16" fill="url(#published)" stroke="#3caa92"/><text class="box-title" x="1332" y="659">Publish</text><text class="box-copy" x="1332" y="686">Current version</text><text class="small" x="1332" y="708">Agent-scoped</text></g>
        <path class="muted-arrow" d="M350 722 V744 H600"/><rect x="605" y="729" width="270" height="42" rx="21" fill="#442d24" stroke="#c47749"/><text class="pill" x="635" y="755" fill="#fed7aa">HELD · INSPECT, DO NOT EXECUTE</text>
        <path class="main-arrow" d="M1392 722 V804 H1065"/><g filter="url(#shadow)"><rect x="680" y="804" width="385" height="58" rx="16" fill="#123b38" stroke="#329681"/><text class="box-title" x="715" y="840">oGMemory canonical Skill store</text></g><path class="main-arrow" d="M680 833 H535"/><path class="main-arrow" d="M1065 833 H1210"/>
        <g filter="url(#shadow)"><rect x="200" y="797" width="335" height="72" rx="16" fill="#15283f" stroke="#446682"/><text class="box-title" x="225" y="828">MCP search · list · read</text><text class="box-copy" x="225" y="852">Explicit skill channel for agents</text></g><g filter="url(#shadow)"><rect x="1210" y="797" width="270" height="72" rx="16" fill="#15283f" stroke="#446682"/><text class="box-title" x="1235" y="828">CLI list · show · sync</text><text class="box-copy" x="1235" y="852">Writes only to configured target</text></g>
        <rect x="70" y="910" width="1460" height="98" rx="22" fill="#0b1b30" stroke="#28435f"/><text class="lane-label" x="100" y="945">DATA BOUNDARY</text><text class="box-copy" x="285" y="945">Raw traces remain internal evidence and never enter ordinary memory retrieval or published SKILL.md.</text><text class="lane-label" x="100" y="978">OWNERSHIP</text><text class="box-copy" x="285" y="978">oGMemory is the canonical source; filesystem copies exist only after an explicit, configured CLI sync.</text>
      </svg>
    </div>
    <p class="note">The dotted route is a non-publishing path. Held candidates remain inspectable metadata and are never exposed as Agent instructions.</p>
  </main>
</body>
</html>
